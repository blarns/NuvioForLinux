name: Linux Desktop Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-linux-desktop:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install VLC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc libavcodec-extra
      
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Build common modules
        run: ./gradlew composeApp:compileKotlinCommonMetadata --no-daemon
      
      - name: Build JVM target
        run: ./gradlew composeApp:compileKotlin --no-daemon
      
      - name: Run JVM tests
        run: ./gradlew composeApp:testJvm --no-daemon
      
      - name: Build JVM distribution
        run: ./gradlew composeApp:packageJvm --no-daemon
      
      - name: Build Uber JAR
        run: ./gradlew composeApp:packageUberJarForCurrentOS --no-daemon
      
      - name: Verify JAR
        run: |
          ls -lh composeApp/build/compose/jars/
          file composeApp/build/compose/jars/*.jar || true
      
      - name: Upload JVM distribution
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: nuvio-linux-desktop-jvm
          path: composeApp/build/compose/jars/
          retention-days: 30
      
      - name: Upload build reports
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: build-reports
          path: composeApp/build/reports/
          retention-days: 7

  integration-test:
    runs-on: ubuntu-latest
    needs: build-linux-desktop
    if: success()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install VLC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc
      
      - name: Download JVM distribution
        uses: actions/download-artifact@v3
        with:
          name: nuvio-linux-desktop-jvm
          path: composeApp/build/compose/jars/
      
      - name: Test HLS Playback
        run: |
          # Quick sanity test - verify VLCJ and Ktor are accessible
          ./gradlew composeApp:testJvmIntegration -PtestFilter="HlsPlayback" --no-daemon || true
      
      - name: Test OAuth Handler
        run: |
          ./gradlew composeApp:testJvmIntegration -PtestFilter="OAuthCallback" --no-daemon || true
      
      - name: Test Subtitle Parsing
        run: |
          ./gradlew composeApp:testJvmIntegration -PtestFilter="SubtitleParsing" --no-daemon || true

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install VLC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc
      
      - name: Check code style
        run: |
          # Run lint/format checks if available
          ./gradlew composeApp:lint --no-daemon || true
      
      - name: Verify dependencies
        run: |
          ./gradlew dependencyUpdates --no-daemon || true
      
      - name: Generate build reports
        run: ./gradlew build --build-cache --no-daemon 2>&1 | tee build.log || true
      
      - name: Archive reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: code-quality-reports
          path: composeApp/build/reports/
          retention-days: 7
