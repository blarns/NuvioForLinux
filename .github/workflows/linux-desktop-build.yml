name: Linux Desktop Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-linux-desktop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install VLC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc libavcodec-extra

      - name: Build JVM target
        run: ./gradlew composeApp:compileKotlinJvm --no-daemon 2>&1

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install VLC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc

      - name: Verify build compiles
        run: ./gradlew composeApp:compileKotlinJvm --no-daemon 2>&1
